name: Probe Cloudflare token
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "len=${#TOKEN}"
          for ep in /user/tokens/verify /accounts /user; do
            echo "--- $ep"
            curl -sS -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4$ep" | head -c 400
            echo
          done
