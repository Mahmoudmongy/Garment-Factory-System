<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نظام إدارة المصنع — نسخة تجريبية</title>
<style>
:root{--bg:#f4f5f7;--cd:#fff;--tx:#1d2733;--mu:#6b7785;--pr:#0f6b5c;--bd:#dde1e6;--er:#c0392b;--ok:#1e8449}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14181c;--cd:#1e252b;--tx:#e8ecef;--mu:#9aa6b1;--pr:#2bb39b;--bd:#323b44}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px "Times New Roman",Times,serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
header{background:var(--pr);color:#fff;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header b{flex:1}.tag{background:#ffffff30;border-radius:12px;padding:2px 10px;font-size:12px}
nav{display:flex;overflow-x:auto;background:var(--cd);border-bottom:1px solid var(--bd)}
nav button{flex:none;border:0;background:none;color:var(--tx);padding:12px 14px;font:inherit;border-bottom:3px solid transparent}
nav button.on{border-color:var(--pr);color:var(--pr);font-weight:700}
main{padding:12px;max-width:1000px;margin:auto}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.k{font-size:12px;color:var(--mu)}.v{font-size:20px;font-weight:700}
button.b{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:11px 14px;font:inherit;margin:2px}
button.s{background:none;color:var(--pr);border:1px solid var(--pr)}
input,select{padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--cd);color:var(--tx);font:inherit;margin:2px;max-width:100%}
input.n{width:90px}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:right;font-size:13px}
.w{overflow-x:auto}#t{position:fixed;bottom:16px;left:12px;right:12px;padding:12px;border-radius:8px;color:#fff;display:none;z-index:9}
.er{color:var(--er)}.ok{color:var(--ok)}h3{margin:6px 0}
</style></head><body>
<header><b>🧵 نظام المصنع</b><span class="tag">نسخة تجريبية — بيانات وهمية</span><span class="tag" id="net"></span><button class="b s" style="color:#fff;border-color:#fff" onclick="if(confirm('تمسح كل التعديلات وترجع للبيانات الأصلية؟')){localStorage.removeItem('gf1');seed();R()}">إعادة ضبط</button></header>
<nav id="nv"></nav><main id="v"></main><div id="t"></div>
<script>
const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789',OPS=[["تركيب الياقة",2.5],["تركيب الكم",3],["خياطة الجنب",2],["التشطيب",2],["الكي",1.25],["التعبئة",.75]],
NM="أحمد,محمد,محمود,علي,حسن,إبراهيم,يوسف,مصطفى,عمر,خالد,سعيد,كريم,طارق,هاني,ياسر,رضا,عادل,سامح,وليد,أسامة".split(','),
SZ=['S','M','L','XL','XXL'],TABS=[['d','الرئيسية'],['c','العملاء'],['o','أوامر التشغيل'],['h','رئيس العمال'],['w','الصنايعية والحسابات'],['s','المستلزمات والمصروفات'],['k','التكلفة والربحية']];
const $=i=>document.getElementById(i),f=n=>(+n||0).toLocaleString('en-US',{maximumFractionDigits:2})+'<small style="font-size:8px;opacity:.7;margin-right:2px">ج.م</small>',q=n=>(+n||0).toLocaleString('en-US',{maximumFractionDigits:2}),today=()=>new Date().toISOString().slice(0,10),
sum=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0),val=i=>$(i).value;
let S,T='d',MODE='code';
const save=()=>{try{localStorage.setItem('gf1',JSON.stringify(S))}catch(e){}};
function toast(r){const t=$('t');t.textContent=String(r[1]).replace(/<[^>]*>/g,' ');t.style.background=r[0]=='ok'?'#1e8449':'#c0392b';t.style.display='block';setTimeout(()=>t.style.display='none',3500);R()}
function gen(){let c;do{c=[...Array(5)].map(()=>A[Math.random()*A.length|0]).join('')}while(S.b.some(b=>b.code===c));return c}
function newOrder(cid,model,sz,price,seeded){const tot=SZ.reduce((s,k)=>s+(+sz[k]||0),0);if(!tot)return['err','لازم تكتب كمية في مقاس واحد على الأقل'];
const o={id:'PO-2026-'+String(15+S.o.length).padStart(4,'0'),c:+cid,model,sz,price:+price,tot,fabIn:0,fabUsed:0,cut:false,fin:0,dl:0};S.o.push(o);if(seeded){o.fabIn=1200;o.fabUsed=1130;o.fin=300;o.dl=200;cutOrder(o)}save();return['ok','اتعمل أمر التشغيل '+o.id+' — '+q(tot)+' قطعة']}
function cutOrder(o){o.cut=true;SZ.forEach(s=>{let r=+o.sz[s]||0;while(r>0){const n=Math.min(25,r);r-=n;S.b.push({id:S.b.length+1,code:gen(),po:o.id,size:s,qty:n,cur:null,done:[]})}})}
function assign(code,wid,op){code=code.trim().toUpperCase();const b=S.b.find(x=>x.code===code);
if(!b)return['err','الكود ده مش موجود'];if(b.cur)return['err','الشنطة دي متسلّمة بالفعل لـ '+S.w[b.cur.w].n];
if(b.done.length==OPS.length)return['err','الشنطة دي خلصت كل المراحل'];if(b.done.includes(op))return['err','الشغلانة دي اتعملت قبل كده'];
if(op>0&&!b.done.includes(op-1))return['err','الشنطة في مرحلة غلط — لازم تخلص "'+OPS[op-1][0]+'" الأول'];
b.cur={w:wid,op,d:today(),by:0};save();return['ok','اتسلّمت '+q(b.qty)+' قطعة لـ '+S.w[wid].n+' — '+OPS[op][0]]}
function submit(id,a,r,w){const b=S.b.find(x=>x.id==id);if(!b||!b.cur)return['err','الشنطة دي مش متسلّمة (يمكن اتسجلت قبل كده)'];
if(a<0||r<0||w<0||a+r+w!=b.qty)return['err','المجموع لازم يساوي '+q(b.qty)+' قطعة'];
const c=b.cur;S.t.push({w:c.w,b:b.code,po:b.po,op:c.op,a,r,wk:w,amt:a*OPS[c.op][1],d:today()});b.done.push(c.op);b.cur=null;save();return['ok','اتسجّل: '+q(a)+' مقبول، '+q(r)+' مرفوض، '+q(w)+' إعادة تشغيل']}
function seed(){S={c:[{id:1,n:'شركة النور',inv:80000,p:[{d:'2026-10-01',a:10000,m:'تحويل بنكي',r:'T-101'},{d:'2026-10-08',a:15000,m:'كاش',r:'C-17'},{d:'2026-10-15',a:5000,m:'كاش',r:'C-18'}]},{id:2,n:'مصنع الأمل',inv:30000,p:[{d:'2026-10-05',a:10000,m:'شيك',r:'CH-5'}]}],
w:NM.map((n,i)=>({id:i,n,role:i?'صنايعي':'رئيس عمال',open:i==3?200:0})),o:[],b:[],t:[],l:[],
x:[{c:'كهربا',a:6500,d:'2026-10-10'},{c:'صيانة ماكينات',a:2000,d:'2026-10-12'}],
m:[{po:'',n:'خيط عام',q:100,u:40,uc:15},{po:'PO-2026-0015',n:'سوستة خاصة',q:520,u:490,uc:5}],tgt:100,sel:1,cs:1,salaries:60000,units:12000};
newOrder(1,'قميص كلاسيك',{S:50,M:100,L:150,XL:100,XXL:50},45,true);
[[1,1],[2,1],[3,2]].forEach(([w,n],i)=>{for(let k=0;k<n+1;k++){const b=S.b[i*3+k];assign(b.code,w,0);submit(b.id,b.qty-1,1,0)}});
S.l.push({w:3,t:'adv',a:200,d:'2026-10-13'},{w:3,t:'part',a:300,d:'2026-10-15'});save()}
function pay(w){const t=S.t.filter(x=>x.w==w),e=sum(t,'amt'),ac=sum(t,'a'),bo=Math.max(0,ac-S.tgt)*.5,ad=sum(S.l.filter(x=>x.w==w&&x.t=='adv'),'a'),pa=sum(S.l.filter(x=>x.w==w&&x.t=='part'),'a'),op=S.w[w].open;
return{e,ac,bo,ad,pa,op,rem:op+e+bo-ad-pa,rj:sum(t,'r'),wk:sum(t,'wk')}}
function cost(o){const wg=sum(S.t.filter(t=>t.po==o.id),'amt'),mt=S.m.filter(m=>m.po==o.id).reduce((s,m)=>s+m.u*m.uc,0),fin=sum(S.o,'fin'),el=fin?sum(S.x,'a')*o.fin/fin:0,lb=o.fin*S.salaries/S.units,tot=wg+mt+el+lb,rev=o.fin*o.price;
return{wg,mt,el,lb,tot,rev,pr:rev-tot,prov:o.fin<o.tot,est:o.tot*o.price}}
function bar(c){let x=4,s='';for(const ch of 'BND'+c)for(let i=7;i>=0;i--){const w=(ch.charCodeAt(0)>>i)&1?3:1.5;s+=`<rect x="${x}" width="${w}" height="40"/>`;x+=w+1.5}return`<svg viewBox="0 0 ${x+4} 40" style="width:220px;background:#fff;fill:#000;direction:ltr">${s}</svg>`}
const opt=(a,fn)=>a.map(fn).join('');
const ST=b=>b.done.length==OPS.length?'خلصت':b.cur?'عند '+S.w[b.cur.w].n+' ('+OPS[b.cur.op][0]+')':b.done.length?'مستنية '+OPS[b.done.length][0]:'جاهزة للتوزيع';
function addCust(){const n=val('cn').trim();if(!n)return toast(['err','اكتب اسم العميل']);S.c.push({id:S.c.length+1,n,inv:0,p:[]});S.sel=S.c.length;save();toast(['ok','اتضاف العميل '+n])}
function addPay(){const c=S.c.find(x=>x.id==S.sel),a=+val('pa'),r=val('pr').trim();if(!(a>0))return toast(['err','اكتب مبلغ صحيح']);
if(r&&c.p.some(p=>p.r==r))return toast(['err','رقم المرجع ده متسجّل قبل كده — الدفعة مش هتتكرر']);
c.p.push({d:today(),a,m:val('pm'),r:r||'-'});save();toast(['ok','اتسجّلت دفعة '+f(a)])}
function mkOrder(){const sz={};SZ.forEach(s=>sz[s]=+val('z'+s)||0);toast(newOrder(val('oc'),val('om'),sz,val('opx')))}
function recv(id){const o=S.o.find(x=>x.id==id),m=+val('fi'+id);if(!(m>0))return toast(['err','اكتب طول القماش']);o.fabIn+=m;save();toast(['ok','اتسجّل استلام '+q(m)+' متر قماش'])}
function doCut(id){const o=S.o.find(x=>x.id==id),m=+val('fu'+id);if(o.cut)return toast(['err','الأمر ده اتقص قبل كده']);if(!(m>0)||m>o.fabIn)return toast(['err','القماش المستخدم لازم يكون أقل من أو يساوي '+q(o.fabIn)+' متر']);o.fabUsed=m;cutOrder(o);save();toast(['ok','اتقص الأمر واتعملت '+S.b.filter(b=>b.po==id).length+' شنطة'])}
function look(){const b=S.b.find(x=>x.code==val('hc').trim().toUpperCase());$('info').innerHTML=b?`<div class="c"><b>${b.po}</b> — ${S.o.find(o=>o.id==b.po).model}<br>المقاس: ${b.size} | الكمية: ${q(b.qty)}<br>الحالة: ${ST(b)}<br>العملية الجاية: ${b.done.length<OPS.length?OPS[b.done.length][0]:'-'}<br>${bar(b.code)}<div class="k">باركود توضيحي — الكود اليدوي: ${b.code}</div></div>`:'<div class="c er">الكود ده مش موجود</div>'}
function doAssign(){toast(assign(val('hc'),+val('hw'),+val('ho')))}
function doSub(id){toast(submit(id,+val('a'+id),+val('r'+id),+val('k'+id)))}
function addL(t){const a=+val('la');if(!(a>0))return toast(['err','اكتب مبلغ صحيح']);S.l.push({w:S.sel,t,a,d:today()});save();toast(['ok',(t=='adv'?'اتسجّلت سلفة ':'اتسجّلت دفعة جزئية ')+f(a)])}
function addM(){const n=val('mn').trim();if(!n)return toast(['err','اكتب اسم الخامة']);S.m.push({po:val('mp'),n,q:+val('mq'),u:+val('mu'),uc:+val('mc')});save();toast(['ok','اتسجّلت الخامة'])}
function addX(){const a=+val('xa');if(!(a>0))return toast(['err','اكتب المبلغ']);S.x.push({c:val('xc'),a,d:val('xd')||today()});save();toast(['ok','اتسجّل مصروف '+val('xc')])}
function qc(id){const o=S.o.find(x=>x.id==id),n=+val('qc'+id);if(!(n>0)||o.fin+n>o.tot)return toast(['err','الكمية غلط — المتاح للاعتماد '+q(o.tot-o.fin)]);o.fin+=n;save();toast(['ok','اتعتمد '+q(n)+' قطعة في الجودة النهائية'])}
function dlv(id){const o=S.o.find(x=>x.id==id),n=+val('dl'+id);if(!(n>0)||o.dl+n>o.fin)return toast(['err','مينفعش تسلّم أكتر من المتاح ('+q(o.fin-o.dl)+' قطعة)']);o.dl+=n;save();toast(['ok','اتسلّم '+q(n)+' قطعة للعميل'])}
function go(t){T=t;R()}
const V={
d(){const op=S.o.filter(o=>o.dl<o.tot).length,wip=S.b.filter(b=>b.cur).reduce((s,b)=>s+b.qty,0),dues=S.w.reduce((s,w)=>s+Math.max(0,pay(w.id).rem),0),due=S.c.reduce((s,c)=>s+c.inv-sum(c.p,'a'),0),k=(a,b)=>`<div class="c"><div class="k">${a}</div><div class="v">${b}</div></div>`;
return`<div class="g">${k('أوامر التشغيل المفتوحة',q(op))}${k('شغل عند الصنايعية (قطعة)',q(wip))}${k('إنتاج مقبول',q(sum(S.t,'a')))}${k('مرفوض',q(sum(S.t,'r')))}${k('محتاج إعادة تشغيل',q(sum(S.t,'wk')))}${k('أجور الصنايعية المستحقة',f(dues))}${k('مستحقات العملاء',f(due))}${k('اتحصّل من العملاء',f(S.c.reduce((s,c)=>s+sum(c.p,'a'),0)))}${k('مصروفات المصنع',f(sum(S.x,'a')))}</div><div class="c"><h3>إنتاج كل صنايعي</h3><div class="w"><table><tr><th>الصنايعي</th><th>مقبول</th><th>مرفوض</th><th>أجر</th></tr>${opt(S.w.filter(w=>pay(w.id).e),w=>{const p=pay(w.id);return`<tr><td>${w.n}</td><td>${q(p.ac)}</td><td>${q(p.rj)}</td><td>${f(p.e)}</td></tr>`})}</table></div></div>`},
c(){const c=S.c.find(x=>x.id==S.sel);let r=0;const rows=[...(c.inv?[{d:'2026-10-01',t:'فاتورة تصنيع',db:c.inv,cr:0}]:[]),...c.p.map(p=>({d:p.d,t:'دفعة '+p.m+' ('+p.r+')',db:0,cr:p.a}))].sort((a,b)=>a.d<b.d?-1:1);
return`<div class="c"><input id="cn" placeholder="اسم عميل جديد"><button class="b" onclick="addCust()">إضافة عميل</button></div><div class="c">${opt(S.c,x=>`<button class="b ${x.id==S.sel?'':'s'}" onclick="S.sel=${x.id};R()">${x.n}</button>`)}</div>
<div class="c"><h3>حساب ${c.n}</h3><div class="g"><div><div class="k">إجمالي الفواتير</div><div class="v">${f(c.inv)}</div></div><div><div class="k">اتحصّل</div><div class="v ok">${f(sum(c.p,'a'))}</div></div><div><div class="k">المتبقي</div><div class="v er">${f(c.inv-sum(c.p,'a'))}</div></div></div></div>
<div class="c"><input id="pa" class="n" type="number" placeholder="المبلغ"><select id="pm"><option>كاش</option><option>تحويل بنكي</option><option>شيك</option></select><input id="pr" class="n" placeholder="رقم المرجع"><button class="b" onclick="addPay()">تسجيل دفعة</button></div>
<div class="c w"><h3>كشف الحساب</h3><table><tr><th>التاريخ</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr>${opt(rows,x=>{r+=x.db-x.cr;return`<tr><td>${x.d}</td><td>${x.t}</td><td>${x.db?f(x.db):''}</td><td>${x.cr?f(x.cr):''}</td><td>${f(r)}</td></tr>`})}</table></div>`},
o(){return`<div class="c"><h3>أمر تشغيل جديد</h3><select id="oc">${opt(S.c,c=>`<option value="${c.id}">${c.n}</option>`)}</select><select id="om"><option>قميص كلاسيك</option><option>تيشيرت</option><option>بولو</option><option>جاكيت</option><option>بنطلون</option></select><br>${opt(SZ,s=>`${s} <input class="n" id="z${s}" type="number" min="0" value="${{S:50,M:100,L:150,XL:100,XXL:50}[s]}" style="width:70px">`)}<br><input id="opx" class="n" type="number" value="45"> سعر التصنيع للقطعة <button class="b" onclick="mkOrder()">إنشاء الأمر</button></div>
${opt(S.o,o=>`<div class="c"><b>${o.id}</b> — ${o.model} — ${S.c.find(c=>c.id==o.c).n} — ${q(o.tot)} قطعة<div class="k">${SZ.map(s=>s+': '+q(o.sz[s])).join(' | ')}</div>
<div>قماش مستلم: ${q(o.fabIn)} م | مستخدم في القص: ${q(o.fabUsed)} م | شنط: ${S.b.filter(b=>b.po==o.id).length}</div>
<input id="fi${o.id}" class="n" type="number" placeholder="متر"><button class="b s" onclick="recv('${o.id}')">استلام قماش</button>${o.cut?'<span class="ok">اتقص ✓</span>':`<input id="fu${o.id}" class="n" type="number" placeholder="متر مستخدم"><button class="b" onclick="doCut('${o.id}')">قص وعمل شنط</button>`}
<details><summary>الشنط والأكواد</summary><div class="w"><table>${opt(S.b.filter(b=>b.po==o.id).slice(0,40),b=>`<tr><td><b>${b.code}</b></td><td>${b.size}</td><td>${q(b.qty)}</td><td>${ST(b)}</td><td><button class="b s" onclick="$('bc${o.id}').innerHTML=bar('${b.code}')+'<div>${b.code}</div>'">باركود</button></td></tr>`)}</table></div><div id="bc${o.id}"></div></details></div>`)}`},
h(){return`<div class="c"><h3>تسليم شغل (رئيس العمال)</h3><button class="b ${MODE=='code'?'':'s'}" onclick="MODE='code';R()">كود يدوي</button><button class="b ${MODE=='cam'?'':'s'}" onclick="MODE='cam';R()">كاميرا</button>
${MODE=='cam'?'<div class="c k">مسح الباركود بالكاميرا مش متفعّل في النسخة التجريبية. هيتركّب في النسخة الكاملة. جرّب "كود يدوي".</div>':''}
<div><input id="hc" placeholder="اكتب كود الشنطة" maxlength="8" style="text-transform:uppercase;font-size:20px;width:160px"> <button class="b s" onclick="look()">دوّر</button></div>
<select id="hw">${opt(S.w.filter(w=>w.id),w=>`<option value="${w.id}">${w.n}</option>`)}</select><select id="ho">${opt(OPS,(o,i)=>`<option value="${i}">${o[0]}</option>`)}</select><button class="b" onclick="doAssign()">تأكيد التسليم</button><div id="info"></div></div>
<div class="c w"><h3>أحدث حركات التسليم</h3><table>${opt(S.b.filter(b=>b.cur),b=>`<tr><td>${b.code}</td><td>${S.w[b.cur.w].n}</td><td>${OPS[b.cur.op][0]}</td><td>${q(b.qty)}</td></tr>`)||'<tr><td>مفيش شغل متسلّم دلوقتي</td></tr>'}</table></div>
<div class="k">للتجربة: خد كود من تبويب "أوامر التشغيل" ← الشنط والأكواد</div>`},
w(){const w=S.w[S.sel],p=pay(w.id),mine=S.b.filter(b=>b.cur&&b.cur.w==w.id);
