<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام المصنع</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f5c50">
<style>
/* ==========================================================================
   Design tokens lifted from the reference app so the rebuild is comparable.
   ========================================================================== */
:root{
  --brand:#0f5c50;          --brand-dark:#0a443b;   --brand-soft:#e3efeb;
  --ink:#1c2430;            --ink-soft:#4a5566;     --ink-faint:#636c7d;
  --paper:#f6f4ef;          --paper-line:#e3ded3;
  --good:#1f7a3d;           --good-soft:#e6f4ea;
  --bad:#b42318;            --bad-soft:#fdecea;
  --warn:#b45309;           --warn-soft:#fef3e2;
  --radius:0.75rem;
  --shadow-card:0 1px 2px rgba(28,36,48,.06),0 1px 1px rgba(28,36,48,.04);
  --shadow-pop:0 24px 60px -30px rgba(28,36,48,.45);
  --sidebar:280px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Times New Roman",Times,serif;
  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;
  font-size:16px;line-height:1.5;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

/* ---------- shell: fixed sidebar on desktop, drawer on mobile ---------- */
.shell{display:flex;min-height:100vh}

aside.sidebar{
  width:var(--sidebar);flex:0 0 var(--sidebar);
  background:#123f38;color:#dfe9e6;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  border-inline-start:1px solid #0d332e;
}
.sb-brand{display:flex;align-items:center;gap:10px;padding:18px 18px 16px;
  border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo{width:38px;height:38px;border-radius:10px;background:var(--brand);
  display:grid;place-items:center;flex:0 0 38px}
.sb-logo svg{width:20px;height:20px;stroke:#fff}
.sb-title{font-size:17px;font-weight:700;color:#fff;line-height:1.2}
.sb-sub{font-size:11px;color:#8fb3ab}

.sb-group{padding:14px 18px 6px;font-size:11px;font-weight:700;letter-spacing:.06em;
  color:#7fa79e}
.sb-link{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:14.5px;
  color:#cfe0dc;border-inline-start:3px solid transparent;transition:background .12s,color .12s}
.sb-link:hover{background:rgba(255,255,255,.06);color:#fff}
.sb-link.active{background:rgba(45,212,191,.14);color:#fff;font-weight:700;
  border-inline-start-color:#2dd4bf}
.sb-link .ico{width:18px;text-align:center;font-size:15px;opacity:.9;flex:0 0 18px}
.sb-foot{margin-top:auto;padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;gap:10px}
.sb-avatar{width:34px;height:34px;border-radius:999px;background:#1d5a50;color:#fff;
  display:grid;place-items:center;font-weight:700;flex:0 0 34px}
.sb-user{font-size:13px;color:#fff;line-height:1.25}
.sb-role{font-size:11px;color:#8fb3ab}
.sb-out{margin-inline-start:auto;background:none;border:1px solid rgba(255,255,255,.18);
  color:#cfe0dc;border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer}
.sb-out:hover{background:rgba(255,255,255,.08);color:#fff}

/* mobile: sidebar slides in as a drawer */
.scrim{position:fixed;inset:0;background:rgba(28,36,48,.45);z-index:60;display:none}
.scrim.on{display:block}
@media (max-width:1023px){
  aside.sidebar{position:fixed;inset-block:0;inset-inline-start:0;z-index:70;
    transform:translateX(105%);transition:transform .26s cubic-bezier(.16,1,.3,1);
    box-shadow:var(--shadow-pop)}
  aside.sidebar.open{transform:translateX(0)}
}

main.content{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:none;align-items:center;gap:10px;padding:10px 14px;
  background:#123f38;color:#fff;position:sticky;top:0;z-index:40}
.topbar .t-title{font-weight:700;font-size:15px}
@media (max-width:1023px){ .topbar{display:flex} }
.page{padding:22px 26px 90px;max-width:1240px;width:100%;margin:0 auto}
@media (max-width:640px){ .page{padding:16px 14px 96px} }

/* ---------- typography ---------- */
h1{font-size:1.6rem;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.15rem;margin:26px 0 10px;font-weight:700}
.sub{color:var(--ink-soft);font-size:.95rem;margin:0 0 18px}
.hint{color:var(--ink-faint);font-size:.85rem;line-height:1.6}
.muted{color:var(--ink-faint)}

/* ---------- surfaces ---------- */
.card{background:#fff;border:1px solid var(--paper-line);border-radius:var(--radius);
  box-shadow:var(--shadow-card);padding:16px;margin-bottom:14px}
.card.tight{padding:12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}

.kpi{background:#fff;border:1px solid var(--paper-line);border-radius:var(--radius);
  padding:14px 16px;box-shadow:var(--shadow-card)}
.kpi .lbl{font-size:.8rem;color:var(--ink-faint);margin-bottom:6px}
.kpi .val{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .val small{font-size:.78rem;font-weight:400;color:var(--ink-faint)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  min-height:40px;border-radius:.5rem;padding:.5rem 1rem;font-size:1rem;font-weight:700;
  border:1px solid transparent;cursor:pointer;transition:background-color .15s,transform .1s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-dark)}
.btn-ghost{background:#fff;color:var(--ink);border-color:var(--paper-line)}
.btn-ghost:hover{background:var(--paper)}
.btn-danger{background:var(--bad);color:#fff}
.btn-sm{min-height:32px;padding:.25rem .7rem;font-size:.85rem;border-radius:.4rem}

.input,select,textarea{width:100%;min-height:44px;border-radius:.5rem;
  border:1px solid var(--paper-line);background:#fff;padding:.5rem .75rem;
  font-family:inherit;font-size:1rem;color:var(--ink);
  transition:border-color .15s,box-shadow .15s}
.input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.label{display:block;font-size:.85rem;font-weight:700;color:var(--ink-soft);margin-bottom:.375rem}
.field{margin-bottom:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.05em}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(24,26,32,.45);display:flex;
  align-items:center;justify-content:center;padding:16px;z-index:60}
.modal{background:#fff;border-radius:var(--radius);box-shadow:0 18px 50px rgba(0,0,0,.22);
  padding:18px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 14px;font-size:1.1rem}
.modal-wide{max-width:min(680px,94vw)}
.modal .acts{display:flex;gap:8px;justify-content:flex-start;margin-top:16px}
.modal .acts .btn{flex:1}
.modal .hint{color:var(--ink-faint);font-size:.8rem;line-height:1.5;margin-top:.3rem}
.input-sm{padding:.3rem .5rem;font-size:.85rem;width:100%}

/* ---------- charts (no external lib) ---------- */
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--ink-faint);margin-bottom:8px}
.legend .dot{display:inline-block;width:9px;height:9px;border-radius:3px;
  margin-inline-end:5px;vertical-align:middle}
.dot.ok{background:var(--good)}.dot.bad{background:var(--bad)}.dot.brand{background:var(--brand)}
.chart{display:flex;align-items:flex-end;gap:2px;padding-top:6px}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;
  min-width:0;justify-content:flex-end}
.chart-bar{width:100%;max-width:22px;background:var(--brand);border-radius:3px 3px 0 0;
  position:relative;min-height:1px;display:flex;flex-direction:column;justify-content:flex-end}
.chart-bar .rej{display:block;background:var(--bad);border-radius:2px;width:100%}
.chart-lbl{font-size:.55rem;color:var(--ink-faint);margin-top:3px;
  writing-mode:vertical-rl;height:26px;overflow:hidden}
.wk-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.wk{background:var(--paper);border:1px solid var(--paper-line);border-radius:10px;
  padding:9px;text-align:center}
.wk-head{font-size:.95rem;color:var(--brand)}
.wk-lbl{font-size:.68rem;color:var(--ink-faint);margin-top:3px}

/* ---------- toolbar + filters ---------- */
.toolbar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
  flex-wrap:wrap;margin-bottom:14px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters>div{min-width:130px}
.chips{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- order stage editor ---------- */
.stage-list{display:flex;flex-direction:column;gap:8px}
.stage-row{display:grid;grid-template-columns:34px minmax(120px,1fr) 130px 150px;
  gap:10px;align-items:end;padding:9px;border:1px solid var(--paper-line);
  border-radius:10px;background:var(--paper)}
.stage-num{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:600;
  margin-bottom:2px}
.stage-name b{font-size:.9rem}
@media(max-width:640px){.stage-row{grid-template-columns:28px 1fr;}
  .stage-row>div:nth-child(3),.stage-row>div:nth-child(4){grid-column:span 1}}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--paper-line);
  background:#fff;box-shadow:var(--shadow-card)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:11px 12px;text-align:start;border-bottom:1px solid var(--paper-line);
  vertical-align:middle;white-space:nowrap}
th{background:#faf8f4;font-size:.8rem;font-weight:700;color:var(--ink-soft)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fbfaf7}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal}

/* ---------- chips & misc ---------- */
.chip{display:inline-flex;align-items:center;gap:.25rem;border-radius:999px;
  padding:.125rem .625rem;font-size:.75rem;font-weight:700;white-space:nowrap}
.chip-open{background:var(--brand-soft);color:var(--brand)}
.chip-done{background:var(--good-soft);color:var(--good)}
.chip-bad{background:var(--bad-soft);color:var(--bad)}
.chip-warn{background:var(--warn-soft);color:var(--warn)}
.chip-idle{background:#eef0f2;color:var(--ink-faint)}

/* ---------- icons ---------- */
/* الأيقونة بتاخد لون النص وحجمه، فمش محتاجة variants لكل حالة. */
.ico-svg{width:1.15em;height:1.15em;flex:0 0 auto;vertical-align:-.16em}
.ico-svg-wrap{display:inline-flex;align-items:center}
.sb-link .ico-svg{width:18px;height:18px;opacity:.85}
.sb-link.active .ico-svg{opacity:1}
.qa-card{display:flex;gap:12px;align-items:center;margin:0;transition:border-color .15s,box-shadow .15s}
.qa-card:hover{border-color:rgba(15,92,80,.4);box-shadow:0 2px 8px rgba(28,36,48,.07)}
.qa-ico{width:40px;height:40px;flex:0 0 40px;border-radius:10px;background:var(--brand-soft);
  color:var(--brand);display:grid;place-items:center}
.qa-ico .ico-svg{width:20px;height:20px}

/* ---------- segmented filter (reference: مفتوح/مكتمل/ملغي/الكل) ---------- */
.seg{display:inline-flex;background:#fff;border:1px solid var(--paper-line);
  border-radius:.625rem;padding:3px;gap:2px;box-shadow:var(--shadow-card)}
.seg button{background:none;border:0;border-radius:.4rem;padding:.375rem .8rem;
  font-family:inherit;font-size:.875rem;font-weight:700;color:var(--ink-soft);
  cursor:pointer;transition:background-color .15s,color .15s}
.seg button:hover{background:var(--paper)}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}

/* ---------- skeletons ---------- */
/* الفراغ اللي بيقفز لشكل مختلف بيخلي الواجهة تحس إنها اتلخبطت. */
@keyframes pulse{50%{opacity:.5}}
.skel{background:rgba(227,222,211,.7);border-radius:.375rem;
  animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite}
.skel-line{height:12px;margin-bottom:9px}
.skel-line:last-child{margin-bottom:0}
.skel-card{height:78px;border-radius:var(--radius);margin-bottom:14px}

/* ---------- page header ---------- */
.phead{display:flex;justify-content:space-between;align-items:flex-start;
  gap:12px;flex-wrap:wrap;margin-bottom:18px}
.phead h1{margin:0}
.phead .sub{margin:4px 0 0}
.phead-acts{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- empty state ---------- */
.empty-ico{width:44px;height:44px;margin:0 auto 10px;border-radius:12px;
  background:var(--paper);color:var(--ink-faint);display:grid;place-items:center}
.empty-ico .ico-svg{width:22px;height:22px}

/* ---------- toasts ---------- */
.toasts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));inset-inline-start:16px;
  z-index:200;display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100vw - 32px))}
.toast{display:flex;align-items:flex-start;gap:8px;background:#fff;
  border:1px solid var(--paper-line);border-radius:.6rem;padding:10px 12px;
  font-size:.875rem;color:var(--ink);box-shadow:0 8px 24px -12px rgba(28,36,48,.35);
  cursor:pointer;animation:toast-in .2s cubic-bezier(.16,1,.3,1) both}
.toast-ico{display:grid;place-items:center;flex:0 0 auto;width:20px;height:20px;
  border-radius:999px;margin-top:1px}
.toast-ok .toast-ico{background:var(--good-soft);color:var(--good)}
.toast-err{border-color:#f2c9c4}
.toast-err .toast-ico{background:var(--bad-soft);color:var(--bad)}
.toast-out{animation:toast-out .2s ease-in both}
@keyframes toast-in{0%{transform:translateY(10px);opacity:0}}
@keyframes toast-out{to{transform:translateY(6px);opacity:0}}

/* دوران زرار الإرسال — بيقول للمستخدم إن الشغل ماشي مش واقف. */
.spin{display:inline-block;width:14px;height:14px;margin-inline-end:6px;
  border:2px solid currentColor;border-top-color:transparent;border-radius:999px;
  animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:1023px){
  /* شريط التبويبات تحت — التنبيه فوقه عشان ما يغطّاش الأزرار. */
  .toasts{bottom:calc(64px + env(safe-area-inset-bottom))}
}

.bar{height:7px;background:#e8e4dc;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:999px}
.empty{text-align:center;color:var(--ink-faint);font-size:.9rem;padding:30px 12px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:.5rem;
  padding:10px 14px;font-size:.9rem;margin-bottom:14px;border:1px solid #f5c6c0}
.ok{background:var(--good-soft);color:var(--good);border-radius:.5rem;
  padding:10px 14px;font-size:.9rem;margin-bottom:14px;border:1px solid #bfe3c9}
.note{background:var(--warn-soft);border:1px solid #f3d9a8;border-radius:.5rem;padding:12px 14px}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- تبويبات (نفس المرجع) ---------- */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--paper-line);
  margin:18px 0 16px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:10px 14px;font-size:.92rem;font-weight:700;color:var(--ink-soft);
  text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;
  transition:color .15s,border-color .15s}
.tab:hover{color:var(--brand)}
.tab.on{color:var(--brand);border-bottom-color:var(--brand)}

/* ---------- أرقام وعملة (نفس المرجع) ---------- */
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.cur{font-size:.62em;color:var(--ink-soft);margin-inline-start:.2em}

/* ---------- تنبيهات المراحل المتأخرة ---------- */
.late-row{display:block;padding:8px 10px;border-radius:.5rem;background:var(--warn-soft);
  color:var(--ink);text-decoration:none;font-size:.9rem;line-height:1.6}
.late-row:hover{background:#fde9c8}

/* ---------- كروت تقدّم الأوامر ---------- */
.order-card{margin:0;text-decoration:none;color:inherit;transition:border-color .15s,box-shadow .15s}
.order-card:hover{border-color:rgba(15,92,80,.4);box-shadow:0 2px 8px rgba(28,36,48,.07)}
.order-card-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.order-card-nums{display:flex;justify-content:space-between;align-items:baseline;
  font-size:.9rem;color:var(--ink-soft)}
.link{color:var(--brand);font-weight:700}
.link:hover{text-decoration:underline}

/* bottom tab bar, mobile only */
.tabbar{display:none}
@media (max-width:1023px){
  .tabbar{display:flex;position:fixed;bottom:0;inset-inline:0;background:#fff;
    border-top:1px solid var(--paper-line);z-index:45;
    padding-bottom:env(safe-area-inset-bottom)}
  .tabbar button{flex:1;background:none;border:0;padding:8px 4px;font-size:11px;
    color:var(--ink-faint);cursor:pointer;display:flex;flex-direction:column;
    align-items:center;gap:2px;font-family:inherit}
  .tabbar button.active{color:var(--brand);font-weight:700}
  .tabbar button .ico-svg{width:20px;height:20px}
}

@keyframes sheet-in{0%{transform:translateY(24px);opacity:0}}
@keyframes drop-in{0%{transform:translateY(-12px);opacity:0}}
@keyframes fade-in{0%{opacity:0}}
.anim-fade{animation:fade-in .18s cubic-bezier(.16,1,.3,1) both}
.anim-sheet{animation:sheet-in .24s cubic-bezier(.16,1,.3,1) both}

/* ---------- شاشة الدخول ---------- */
body.auth-locked .topbar,body.auth-locked .tabbar{display:none}
/* المرجع: تدرّج خفيف في النص + كارت أبيض بإطار منقّط جواه. */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;position:relative;overflow:hidden;background:var(--paper)}
.login-wrap::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 0%,rgba(15,92,80,.08),transparent 60%)}
.login-card{position:relative;width:100%;max-width:24rem;background:#fff;
  border:1px solid var(--paper-line);border-radius:1rem;padding:28px;
  box-shadow:0 24px 60px -30px rgba(28,36,48,.45);
  display:flex;flex-direction:column;
  animation:sheet-in .24s cubic-bezier(.16,1,.3,1) both}
.login-card::before{content:"";position:absolute;inset:8px;border-radius:.75rem;
  border:1px dashed rgba(15,92,80,.2);pointer-events:none}
.login-brand{position:relative;text-align:center;margin-bottom:24px}
.login-logo{width:56px;height:56px;margin:0 auto 12px;border-radius:.75rem;
  background:var(--brand);color:#fff;display:grid;place-items:center;
  box-shadow:var(--shadow-card)}
.login-brand h1{margin:0;font-size:1.75rem;font-weight:700;color:var(--ink)}
.login-brand p{margin:4px 0 0;color:var(--ink-soft);font-size:1rem}
.login-card label{position:relative;font-size:.9rem;font-weight:700;
  color:var(--ink-soft);margin-bottom:.375rem;display:block}
.login-card input{position:relative;width:100%;min-height:48px;padding:.5rem .75rem;
  border:1px solid var(--paper-line);border-radius:.5rem;font-size:1.05rem;
  font-family:inherit;background:#fff;color:var(--ink);
  transition:border-color .15s,box-shadow .15s}
.login-card input:focus{outline:none;border-color:var(--brand);
  box-shadow:0 0 0 3px var(--brand-soft)}
.login-card input#lgUser{margin-bottom:16px}
.login-err{position:relative;min-height:18px;color:var(--bad);font-size:.85rem;
  margin:8px 0 0;text-align:center}
.login-btn{position:relative;margin-top:12px;min-height:48px;border:0;border-radius:.5rem;
  background:var(--brand);color:#fff;font-size:1.05rem;font-weight:700;
  cursor:pointer;font-family:inherit;transition:background-color .15s}
.login-btn:hover{background:var(--brand-dark)}
.login-btn:disabled{opacity:.65;cursor:progress}
.login-foot{position:relative;margin:14px 0 0;text-align:center;font-size:.8rem;color:var(--ink-faint)}
</style>
</head>
<body>
<div class="scrim" id="scrim"></div>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content">
    <div class="topbar">
      <button class="btn btn-sm" id="menuBtn"
        style="background:#1d5a50;border-color:#2a6b60;color:#fff">☰</button>
      <span class="t-title">نظام المصنع</span>
    </div>
    <div class="page" id="app"></div>
  </main>
