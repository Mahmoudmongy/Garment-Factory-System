<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام المصنع</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f5c50">
<style>
/* ==========================================================================
   Design tokens lifted from the reference app so the rebuild is comparable.
   ========================================================================== */
:root{
  --brand:#0f5c50;          --brand-dark:#0a443b;   --brand-soft:#e3efeb;
  --ink:#1c2430;            --ink-soft:#4a5566;     --ink-faint:#636c7d;
  --paper:#f6f4ef;          --paper-line:#e3ded3;
  --good:#1f7a3d;           --good-soft:#e6f4ea;
  --bad:#b42318;            --bad-soft:#fdecea;
  --warn:#b45309;           --warn-soft:#fef3e2;
  --radius:0.75rem;
  --shadow-card:0 1px 2px rgba(28,36,48,.06),0 1px 1px rgba(28,36,48,.04);
  --shadow-pop:0 24px 60px -30px rgba(28,36,48,.45);
  --sidebar:280px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Times New Roman",Times,serif;
  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;
  font-size:16px;line-height:1.5;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

/* ---------- shell: fixed sidebar on desktop, drawer on mobile ---------- */
.shell{display:flex;min-height:100vh}

aside.sidebar{
  width:var(--sidebar);flex:0 0 var(--sidebar);
  background:#123f38;color:#dfe9e6;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  border-inline-start:1px solid #0d332e;
}
.sb-brand{display:flex;align-items:center;gap:10px;padding:18px 18px 16px;
  border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo{width:38px;height:38px;border-radius:10px;background:var(--brand);
  display:grid;place-items:center;flex:0 0 38px}
.sb-logo svg{width:20px;height:20px;stroke:#fff}
.sb-title{font-size:17px;font-weight:700;color:#fff;line-height:1.2}
.sb-sub{font-size:11px;color:#8fb3ab}

.sb-group{padding:14px 18px 6px;font-size:11px;font-weight:700;letter-spacing:.06em;
  color:#7fa79e}
.sb-link{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:14.5px;
  color:#cfe0dc;border-inline-start:3px solid transparent;transition:background .12s,color .12s}
.sb-link:hover{background:rgba(255,255,255,.06);color:#fff}
.sb-link.active{background:rgba(45,212,191,.14);color:#fff;font-weight:700;
  border-inline-start-color:#2dd4bf}
.sb-link .ico{width:18px;text-align:center;font-size:15px;opacity:.9;flex:0 0 18px}
.sb-foot{margin-top:auto;padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;gap:10px}
.sb-avatar{width:34px;height:34px;border-radius:999px;background:#1d5a50;color:#fff;
  display:grid;place-items:center;font-weight:700;flex:0 0 34px}
.sb-user{font-size:13px;color:#fff;line-height:1.25}
.sb-role{font-size:11px;color:#8fb3ab}
.sb-out{margin-inline-start:auto;background:none;border:1px solid rgba(255,255,255,.18);
  color:#cfe0dc;border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer}
.sb-out:hover{background:rgba(255,255,255,.08);color:#fff}

/* mobile: sidebar slides in as a drawer */
.scrim{position:fixed;inset:0;background:rgba(28,36,48,.45);z-index:60;display:none}
.scrim.on{display:block}
@media (max-width:1023px){
  aside.sidebar{position:fixed;inset-block:0;inset-inline-start:0;z-index:70;
    transform:translateX(105%);transition:transform .26s cubic-bezier(.16,1,.3,1);
    box-shadow:var(--shadow-pop)}
  aside.sidebar.open{transform:translateX(0)}
}

main.content{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:none;align-items:center;gap:10px;padding:10px 14px;
  background:#123f38;color:#fff;position:sticky;top:0;z-index:40}
.topbar .t-title{font-weight:700;font-size:15px}
@media (max-width:1023px){ .topbar{display:flex} }
.page{padding:22px 26px 90px;max-width:1240px;width:100%;margin:0 auto}
@media (max-width:640px){ .page{padding:16px 14px 96px} }

/* ---------- typography ---------- */
h1{font-size:1.6rem;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.15rem;margin:26px 0 10px;font-weight:700}
.sub{color:var(--ink-soft);font-size:.95rem;margin:0 0 18px}
.hint{color:var(--ink-faint);font-size:.85rem;line-height:1.6}
.muted{color:var(--ink-faint)}

/* ---------- surfaces ---------- */
.card{background:#fff;border:1px solid var(--paper-line);border-radius:var(--radius);
  box-shadow:var(--shadow-card);padding:16px;margin-bottom:14px}
.card.tight{padding:12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}

.kpi{background:#fff;border:1px solid var(--paper-line);border-radius:var(--radius);
  padding:14px 16px;box-shadow:var(--shadow-card)}
.kpi .lbl{font-size:.8rem;color:var(--ink-faint);margin-bottom:6px}
.kpi .val{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .val small{font-size:.78rem;font-weight:400;color:var(--ink-faint)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  min-height:40px;border-radius:.5rem;padding:.5rem 1rem;font-size:1rem;font-weight:700;
  border:1px solid transparent;cursor:pointer;transition:background-color .15s,transform .1s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-dark)}
.btn-ghost{background:#fff;color:var(--ink);border-color:var(--paper-line)}
.btn-ghost:hover{background:var(--paper)}
.btn-danger{background:var(--bad);color:#fff}
.btn-sm{min-height:32px;padding:.25rem .7rem;font-size:.85rem;border-radius:.4rem}

.input,select,textarea{width:100%;min-height:44px;border-radius:.5rem;
  border:1px solid var(--paper-line);background:#fff;padding:.5rem .75rem;
  font-family:inherit;font-size:1rem;color:var(--ink);
  transition:border-color .15s,box-shadow .15s}
.input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.label{display:block;font-size:.85rem;font-weight:700;color:var(--ink-soft);margin-bottom:.375rem}
.field{margin-bottom:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.05em}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(24,26,32,.45);display:flex;
  align-items:center;justify-content:center;padding:16px;z-index:60}
.modal{background:#fff;border-radius:var(--radius);box-shadow:0 18px 50px rgba(0,0,0,.22);
  padding:18px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 14px;font-size:1.1rem}
.modal .acts{display:flex;gap:8px;justify-content:flex-start;margin-top:16px}
.modal .acts .btn{flex:1}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--paper-line);
  background:#fff;box-shadow:var(--shadow-card)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:11px 12px;text-align:start;border-bottom:1px solid var(--paper-line);
  vertical-align:middle;white-space:nowrap}
th{background:#faf8f4;font-size:.8rem;font-weight:700;color:var(--ink-soft)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fbfaf7}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal}

/* ---------- chips & misc ---------- */
.chip{display:inline-flex;align-items:center;gap:.25rem;border-radius:999px;
  padding:.125rem .625rem;font-size:.75rem;font-weight:700;white-space:nowrap}
.chip-open{background:var(--brand-soft);color:var(--brand)}
.chip-done{background:var(--good-soft);color:var(--good)}
.chip-bad{background:var(--bad-soft);color:var(--bad)}
.chip-warn{background:var(--warn-soft);color:var(--warn)}
.chip-idle{background:#eef0f2;color:var(--ink-faint)}
.bar{height:7px;background:#e8e4dc;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:999px}
.empty{text-align:center;color:var(--ink-faint);font-size:.9rem;padding:30px 12px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:.5rem;
  padding:10px 14px;font-size:.9rem;margin-bottom:14px;border:1px solid #f5c6c0}
.ok{background:var(--good-soft);color:var(--good);border-radius:.5rem;
  padding:10px 14px;font-size:.9rem;margin-bottom:14px;border:1px solid #bfe3c9}
.note{background:var(--warn-soft);border:1px solid #f3d9a8;border-radius:.5rem;padding:12px 14px}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.link{color:var(--brand);font-weight:700}
.link:hover{text-decoration:underline}

/* bottom tab bar, mobile only */
.tabbar{display:none}
@media (max-width:1023px){
  .tabbar{display:flex;position:fixed;bottom:0;inset-inline:0;background:#fff;
    border-top:1px solid var(--paper-line);z-index:45;
    padding-bottom:env(safe-area-inset-bottom)}
  .tabbar button{flex:1;background:none;border:0;padding:8px 4px;font-size:11px;
    color:var(--ink-faint);cursor:pointer}
  .tabbar button.active{color:var(--brand);font-weight:700}
  .tabbar button span{display:block;font-size:18px;line-height:1.3}
}

/* ---------- شاشة الدخول ---------- */
body.auth-locked .topbar,body.auth-locked .tabbar{display:none}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;background:linear-gradient(160deg,#0f5c50 0%,#0a443b 55%,#123a34 100%)}
.login-card{width:100%;max-width:380px;background:#fff;border-radius:1rem;padding:28px 24px;
  box-shadow:0 30px 70px -25px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:6px}
.login-brand{text-align:center;margin-bottom:14px}
.login-logo{font-size:40px;line-height:1}
.login-brand h1{margin:6px 0 2px;font-size:22px;color:var(--ink)}
.login-brand p{margin:0;color:var(--ink-faint);font-size:13px}
.login-card label{font-size:13px;color:var(--ink-soft);margin-top:8px}
.login-card input{padding:12px;border:1px solid var(--paper-line);border-radius:.6rem;
  font-size:15px;font-family:inherit;background:#fbfaf7}
.login-card input:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
.login-err{min-height:18px;color:var(--bad);font-size:13px;margin-top:6px}
.login-btn{margin-top:6px;padding:13px;border:0;border-radius:.7rem;background:var(--brand);
  color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.login-btn:disabled{opacity:.65;cursor:progress}
.login-foot{margin:12px 0 0;text-align:center;font-size:12px;color:var(--ink-faint)}
</style>
</head>
<body>
<div class="scrim" id="scrim"></div>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content">
    <div class="topbar">
      <button class="btn btn-sm" id="menuBtn"
        style="background:#1d5a50;border-color:#2a6b60;color:#fff">☰</button>
      <span class="t-title">نظام المصنع</span>
    </div>
    <div class="page" id="app"></div>
  </main>
</div>
<nav class="tabbar" id="tabbar"></nav>
<script src="/config.js"></script>
<script src="/db.js"></script>
<script src="/app.js?v=27"></script>
<script>
  // التسجيل بعد load عشان مايتنافسش مع تحميل الواجهة.
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {
        // الفشل مش قاتل: التطبيق بيشتغل عادي، بس من غير offline.
      });
    });
  }
</script>
</body>
</html>
